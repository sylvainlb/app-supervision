<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <title>Supervision énergétique</title>
    <style>
      body { margin: 0; font-family: sans-serif; }
      #header { display: flex; align-items: center; gap: 12px; background: #111827; color: #f9fafb; padding: 10px 16px; }
      #header .title { font-size: 1.1rem; font-weight: bold; }
      #header .spacer { flex: 1; }
      #header .user { font-size: 0.9rem; color: #d1d5db; }
      #header button { background: #374151; color: #f9fafb; border: 0; border-radius: 4px; padding: 6px 10px; cursor: pointer; }
      #layout { display: flex; min-height: calc(100vh - 41px); }
      #menu { width: 220px; background: #1f2937; color: #f9fafb; padding: 16px 0; flex-shrink: 0; }
      #menu a { display: block; padding: 10px 16px; color: #d1d5db; text-decoration: none; cursor: pointer; }
      #menu a:hover { background: #374151; }
      #menu a.active { background: #4b5563; color: #fff; font-weight: bold; }
      #app { flex: 1; padding: 16px; }
    </style>
  </head>
  <body>
    <sib-auth></sib-auth>
    <header id="header">
      <span class="title">Supervision énergétique</span>
      <span class="spacer"></span>
      <span class="user" id="user"></span>
      <button id="logout" type="button">Se déconnecter</button>
    </header>
    <div id="layout">
      <nav id="menu"></nav>
      <main id="app"></main>
    </div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
