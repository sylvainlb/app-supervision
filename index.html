<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <title>Supervision énergétique</title>
    <style>
      #header {
        position: fixed; top: 0; left: 0; right: 0; height: 54px; z-index: 100;
        display: flex; align-items: center; gap: 12px;
        background: #0f172a; color: #f8fafc; padding: 0 20px;
        box-shadow: var(--shadow); border-bottom: 3px solid var(--brand);
      }
      #header .title { font-size: 1.15rem; font-weight: 700; letter-spacing: 0.2px; color: #f8fafc; }
      #menu h1 { color: #64748b; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em; padding: 0 18px 10px; margin: 0; }
      #header .title::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--brand); margin-right: 9px; }
      #header .spacer { flex: 1; }
      #header .user { font-size: 0.9rem; color: #94a3b8; }
      #header button {
        background: transparent; color: #e2e8f0; border: 1px solid #334155;
        border-radius: var(--radius); padding: 6px 12px; cursor: pointer; font-size: 0.85rem;
      }
      #header button:hover { background: #1e293b; border-color: var(--brand); }
      #layout { display: block; padding-top: 54px; min-height: 100vh; }
      /* Menu toujours visible, même quand le contenu scrolle */
      #menu {
        position: fixed; top: 54px; left: 0; bottom: 0; width: 230px;
        background: #0f172a; padding: 14px 0; overflow-y: auto; z-index: 90;
      }
      #menu a {
        display: block; padding: 11px 18px; color: #94a3b8; text-decoration: none; cursor: pointer;
        border-left: 3px solid transparent; font-size: 0.93rem;
      }
      #menu a:hover { background: #1e293b; color: #f1f5f9; }
      #menu a.active { background: #134e4a; color: #5eead4; font-weight: 600; border-left-color: var(--brand); }
      #app { margin-left: 230px; padding: 24px 28px; min-height: calc(100vh - 54px); }
    </style>
  </head>
  <body>
    <header id="header">
      <span class="title">Supervision énergétique</span>
      <span class="spacer"></span>
      <span class="user" id="user"></span>
      <button id="logout" type="button">Se déconnecter</button>
    </header>
    <div id="layout">
      <nav id="menu"></nav>
      <main id="app"></main>
    </div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
