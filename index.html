<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Menu icons: inline SVG (@facis/app-store/components/shared/icons.js) — ligature icon fonts
         do not pierce the shadow DOM of web components. -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <title>Energy supervision</title>
    <style>
      #header {
        position: fixed; top: 0; left: 0; right: 0; height: 58px; z-index: 2000; /* above the Leaflet panes (<= 1000) */
        display: flex; align-items: center; gap: 12px;
        background: linear-gradient(100deg, #ffffff 0%, #f0fdf9 55%, #d1fae5 130%);
        color: #0f172a; padding: 0 22px;
        box-shadow: 0 2px 12px rgba(6, 78, 59, 0.10);
        border-bottom: 2px solid #34d399;
      }
      #header .title {
        font-size: 1.12rem; font-weight: 700; letter-spacing: 0.2px; color: #064e3b;
        display: inline-flex; align-items: center; gap: 10px;
      }
      #header .title .logo {
        display: inline-flex; align-items: center; justify-content: center;
        width: 30px; height: 30px; border-radius: 9px;
        background: linear-gradient(135deg, #34d399, #10b981);
        box-shadow: 0 2px 8px rgba(16, 185, 129, 0.4), inset 0 1px 0 rgba(255,255,255,0.35);
      }
      #header .title .logo svg { width: 17px; height: 17px; }
      #menu h1 {
        color: #64748b; font-size: 0.68rem; font-weight: 700; text-transform: uppercase;
        letter-spacing: 0.14em; padding: 0 20px 12px; margin: 0;
      }
      #header .spacer { flex: 1; }
      /* Account block: avatar + name, opens a dropdown menu (app store / log out) */
      #header .account { position: relative; }
      #header .account-btn {
        display: flex; align-items: center; gap: 9px;
        background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0;
        border-radius: 999px; padding: 4px 12px 4px 5px; cursor: pointer;
        font-size: 0.86rem; font-weight: 500; font-family: inherit;
        transition: background 0.15s ease, border-color 0.15s ease;
      }
      #header .account-btn:hover { background: #d1fae5; border-color: #10b981; color: #065f46; }
      #header .account-btn .avatar {
        width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
        background: linear-gradient(135deg, #34d399, #10b981); color: #064e3b;
        font-size: 0.76rem; font-weight: 700;
        display: inline-flex; align-items: center; justify-content: center;
        box-shadow: inset 0 1px 0 rgba(255,255,255,.4);
      }
      #header .account-btn .chevron { width: 14px; height: 14px; transition: transform .15s ease; opacity: .7; }
      #header .account-btn[aria-expanded="true"] .chevron { transform: rotate(180deg); }
      #header .account-menu {
        position: absolute; top: calc(100% + 8px); right: 0; min-width: 220px; z-index: 200;
        background: #fff; border: 1px solid #e5eaf0; border-radius: 12px;
        box-shadow: 0 4px 10px rgba(6,78,59,.08), 0 18px 44px rgba(6,78,59,.14);
        padding: 6px; display: flex; flex-direction: column; gap: 2px;
      }
      #header .account-menu[hidden] { display: none; }
      #header .account-menu button {
        display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
        background: #fff; color: #334155; border: 0; border-radius: 8px;
        padding: 9px 11px; font-size: 0.88rem; font-weight: 500; box-shadow: none;
      }
      #header .account-menu button:hover { background: #ecfdf5; color: #065f46; }
      #header .account-menu button svg { width: 17px; height: 17px; color: #64748b; flex-shrink: 0; }
      #header button {
        background: #fff; color: #047857; border: 1px solid #a7f3d0;
        border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: 0.83rem; font-weight: 500;
        transition: background 0.15s ease, border-color 0.15s ease;
      }
      #header button:hover { background: #d1fae5; border-color: #10b981; color: #065f46; }
      #layout { display: block; padding-top: 58px; min-height: 100vh; }
      /* Menu always visible, even when the content scrolls */
      #menu {
        position: fixed; top: 58px; left: 0; bottom: 0; width: 236px;
        background: linear-gradient(180deg, #ffffff 0%, #f0fdf9 100%);
        padding: 18px 10px; overflow-y: auto; z-index: 1900;
        border-right: 1px solid #e5eaf0;
        box-shadow: 2px 0 12px rgba(6, 78, 59, 0.05);
      }
      #menu a {
        display: flex; align-items: center; gap: 11px; padding: 10px 14px; margin: 2px 4px;
        color: #64748b; text-decoration: none; cursor: pointer; font-size: 0.92rem; font-weight: 500;
        border-left: 3px solid transparent; border-radius: 0 10px 10px 0;
        transition: background 0.15s ease, color 0.15s ease;
      }
      #menu a svg { width: 18px; height: 18px; flex-shrink: 0; opacity: 0.9; }
      #menu a:hover { background: #ecfdf5; color: #065f46; }
      #menu a.active {
        background: linear-gradient(90deg, #d1fae5, rgba(209, 250, 229, 0.35));
        color: #047857; font-weight: 600; border-left-color: #10b981;
      }
      #menu a.active svg { opacity: 1; }
      #app { margin-left: 236px; padding: 28px 32px; min-height: calc(100vh - 58px); }
      @media (max-width: 860px) {
        #menu { width: 64px; padding: 14px 6px; }
        #menu h1 { display: none; }
        #menu a { justify-content: center; padding: 11px 0; border-left: 0; border-radius: 10px; }
        #menu a span.lbl { display: none; }
        #app { margin-left: 64px; padding: 20px 16px; }
      }
    </style>
  </head>
  <body>
    <header id="header">
      <span class="title">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M13 2 3 14h7l-1 8 11-13h-7l0-7z" fill="#fff" stroke="none"/>
          </svg>
        </span>
        Energy supervision
      </span>
      <span class="spacer"></span>
      <div class="account" id="account">
        <button id="account-btn" class="account-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="account-menu">
          <span class="avatar" id="avatar" aria-hidden="true">?</span>
          <span class="user" id="user"></span>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="account-menu" id="account-menu" role="menu" hidden>
          <button type="button" role="menuitem" id="appstore">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.09a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.09a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg>
            App store
          </button>
          <button type="button" role="menuitem" id="uieditor">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><line x1="17.5" y1="14" x2="17.5" y2="21"/><line x1="14" y1="17.5" x2="21" y2="17.5"/></svg>
            My apps
          </button>
          <button type="button" role="menuitem" id="modelregistry">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
            Model registry
          </button>
          <button type="button" role="menuitem" id="logout">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Log out
          </button>
        </div>
      </div>
    </header>
    <div id="layout">
      <nav id="menu"></nav>
      <main id="app"></main>
    </div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
