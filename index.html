<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <title>Energy supervision</title>
    <style>
      #header {
        position: fixed; top: 0; left: 0; right: 0; height: 58px; z-index: 100;
        display: flex; align-items: center; gap: 12px;
        background: linear-gradient(100deg, #0b1220 0%, #0f172a 55%, #134e4a 130%);
        color: #f8fafc; padding: 0 22px;
        box-shadow: 0 2px 12px rgba(2, 6, 23, 0.35);
        border-bottom: 1px solid rgba(94, 234, 212, 0.25);
      }
      #header .title {
        font-size: 1.12rem; font-weight: 700; letter-spacing: 0.2px; color: #f8fafc;
        display: inline-flex; align-items: center; gap: 10px;
      }
      #header .title .logo {
        display: inline-flex; align-items: center; justify-content: center;
        width: 30px; height: 30px; border-radius: 9px;
        background: linear-gradient(135deg, #14b8a6, #0f766e);
        box-shadow: 0 2px 8px rgba(20, 184, 166, 0.45), inset 0 1px 0 rgba(255,255,255,0.25);
      }
      #header .title .logo svg { width: 17px; height: 17px; }
      #menu h1 {
        color: #64748b; font-size: 0.68rem; font-weight: 700; text-transform: uppercase;
        letter-spacing: 0.14em; padding: 0 20px 12px; margin: 0;
      }
      #header .spacer { flex: 1; }
      #header .user {
        font-size: 0.86rem; color: #94a3b8;
        background: rgba(148, 163, 184, 0.12); border: 1px solid rgba(148, 163, 184, 0.22);
        padding: 5px 12px; border-radius: 999px;
      }
      #header button {
        background: transparent; color: #e2e8f0; border: 1px solid #334155;
        border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: 0.83rem; font-weight: 500;
        transition: background 0.15s ease, border-color 0.15s ease;
      }
      #header button:hover { background: rgba(20, 184, 166, 0.18); border-color: #14b8a6; color: #5eead4; }
      #layout { display: block; padding-top: 58px; min-height: 100vh; }
      /* Menu toujours visible, même quand le contenu scrolle */
      #menu {
        position: fixed; top: 58px; left: 0; bottom: 0; width: 236px;
        background: linear-gradient(180deg, #0f172a 0%, #0c1425 100%);
        padding: 18px 10px; overflow-y: auto; z-index: 90;
        border-right: 1px solid rgba(148, 163, 184, 0.12);
      }
      #menu a {
        display: flex; align-items: center; gap: 11px; padding: 10px 14px; margin: 2px 4px;
        color: #94a3b8; text-decoration: none; cursor: pointer; font-size: 0.92rem; font-weight: 500;
        border-left: 3px solid transparent; border-radius: 0 10px 10px 0;
        transition: background 0.15s ease, color 0.15s ease;
      }
      #menu a svg { width: 18px; height: 18px; flex-shrink: 0; opacity: 0.85; }
      #menu a:hover { background: rgba(30, 41, 59, 0.8); color: #f1f5f9; }
      #menu a.active {
        background: linear-gradient(90deg, rgba(19, 78, 74, 0.9), rgba(19, 78, 74, 0.35));
        color: #5eead4; font-weight: 600; border-left-color: #14b8a6;
      }
      #menu a.active svg { opacity: 1; }
      #app { margin-left: 236px; padding: 28px 32px; min-height: calc(100vh - 58px); }
      @media (max-width: 860px) {
        #menu { width: 64px; padding: 14px 6px; }
        #menu h1 { display: none; }
        #menu a { justify-content: center; padding: 11px 0; border-left: 0; border-radius: 10px; }
        #menu a span.lbl { display: none; }
        #app { margin-left: 64px; padding: 20px 16px; }
      }
    </style>
  </head>
  <body>
    <header id="header">
      <span class="title">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M13 2 3 14h7l-1 8 11-13h-7l0-7z" fill="#fff" stroke="none"/>
          </svg>
        </span>
        Energy supervision
      </span>
      <span class="spacer"></span>
      <span class="user" id="user"></span>
      <button id="logout" type="button">Log out</button>
    </header>
    <div id="layout">
      <nav id="menu"></nav>
      <main id="app"></main>
    </div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
