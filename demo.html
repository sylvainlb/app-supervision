<html lang="fr"><head><meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
body { font-family:"Inter",system-ui,sans-serif; margin:0; background:#f4f6f9; }
#menu { position:fixed; top:0; left:0; bottom:0; width:236px; background:linear-gradient(180deg,#fff,#f0fdf9); padding:18px 10px; border-right:1px solid #e5eaf0; }
#menu h1 { color:#94a3b8; font-size:.68rem; font-weight:700; text-transform:uppercase; letter-spacing:.14em; padding:0 20px 12px; margin:0; }
